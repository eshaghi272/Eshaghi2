services:
  - type: web
    name: eshaghi2
    runtime: docker
    repo: https://github.com/eshaghi272/Eshaghi2
    plan: free
    rootDir: beauty-backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health