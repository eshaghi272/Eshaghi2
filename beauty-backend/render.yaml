# Path: render.yaml (در ریشه پروژه - D:\Eshaghi)
services:
  - type: web
    name: beauty-clinic-backend
    runtime: docker
    repo: https://github.com/eshaghi272/Eshaghi2
    plan: free
    dockerfilePath: ./backend/Dockerfile
    rootDir: ./backend
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /app/clinic.db
    healthCheckPath: /health